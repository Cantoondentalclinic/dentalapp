<title>青陵家庭科ドリル</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
  :root{
    --paper:#f2eee2;
    --paper-raised:#fbf9f2;
    --ink:#2c2620;
    --ink-soft:#736a5b;
    --ink-faint:#a89d8a;
    --line:#dbd2bd;
    --accent:#2c4f70;
    --accent-ink:#f4f0e4;
    --accent-soft:#e3e9ee;
    --gold:#a8781f;
    --good-bg:#e4efe1;
    --good-ink:#2e6b3e;
    --bad-bg:#f5e3de;
    --bad-ink:#a4432b;
    --cat-shoku-bg:#f0dcc0; --cat-shoku-fg:#7a4a12;
    --cat-i-bg:#dbe3ee;    --cat-i-fg:#2c4f70;
    --cat-ju-bg:#ecdbd2;   --cat-ju-fg:#8a4630;
    --cat-shohi-bg:#e9e4c4; --cat-shohi-fg:#726213;
    --cat-iku-bg:#f0dbe1;  --cat-iku-fg:#9c4560;
    --cat-fuku-bg:#d9e6e2; --cat-fuku-fg:#2f6a5f;
    --shadow:0 1px 2px rgba(44,38,32,0.06),0 6px 16px -8px rgba(44,38,32,0.18);
    --font-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
    --font-body:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#211e1a;
      --paper-raised:#2a2622;
      --ink:#ece6d8;
      --ink-soft:#b3a996;
      --ink-faint:#7d735f;
      --line:#42392e;
      --accent:#8db2d6;
      --accent-ink:#1c2a36;
      --accent-soft:#2c3947;
      --gold:#d9a94a;
      --good-bg:#243a29;
      --good-ink:#8fd19e;
      --bad-bg:#3d2822;
      --bad-ink:#e39a84;
      --cat-shoku-bg:#4a3a20; --cat-shoku-fg:#e8c98c;
      --cat-i-bg:#28374a;    --cat-i-fg:#a9c6e3;
      --cat-ju-bg:#432e24;   --cat-ju-fg:#e0ab90;
      --cat-shohi-bg:#3c3820; --cat-shohi-fg:#dcce8c;
      --cat-iku-bg:#452631;  --cat-iku-fg:#e6a9bc;
      --cat-fuku-bg:#233b35; --cat-fuku-fg:#9bd3c4;
      --shadow:0 1px 2px rgba(0,0,0,0.3),0 8px 20px -10px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"]{
    --paper:#211e1a;
    --paper-raised:#2a2622;
    --ink:#ece6d8;
    --ink-soft:#b3a996;
    --ink-faint:#7d735f;
    --line:#42392e;
    --accent:#8db2d6;
    --accent-ink:#1c2a36;
    --accent-soft:#2c3947;
    --gold:#d9a94a;
    --good-bg:#243a29;
    --good-ink:#8fd19e;
    --bad-bg:#3d2822;
    --bad-ink:#e39a84;
    --cat-shoku-bg:#4a3a20; --cat-shoku-fg:#e8c98c;
    --cat-i-bg:#28374a;    --cat-i-fg:#a9c6e3;
    --cat-ju-bg:#432e24;   --cat-ju-fg:#e0ab90;
    --cat-shohi-bg:#3c3820; --cat-shohi-fg:#dcce8c;
    --cat-iku-bg:#452631;  --cat-iku-fg:#e6a9bc;
    --cat-fuku-bg:#233b35; --cat-fuku-fg:#9bd3c4;
    --shadow:0 1px 2px rgba(0,0,0,0.3),0 8px 20px -10px rgba(0,0,0,0.5);
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:15px;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:28px 20px 64px;
    display:flex;
    flex-direction:column;
    gap:20px;
  }

  /* ---------- header ---------- */
  header{display:flex;flex-direction:column;gap:10px}
  .eyebrow{
    font-size:11.5px;
    letter-spacing:.14em;
    color:var(--ink-faint);
    font-weight:500;
  }
  h1{
    margin:0;
    font-family:var(--font-display);
    font-weight:900;
    font-size:clamp(24px,6vw,30px);
    letter-spacing:.02em;
    text-wrap:balance;
  }
  .stitch{
    height:2px;
    background-image:repeating-linear-gradient(
      to right,
      var(--ink-faint) 0 7px,
      transparent 7px 14px
    );
    opacity:.55;
  }
  .tagline{color:var(--ink-soft);font-size:13.5px;margin:0}

  /* ---------- generic ---------- */
  .card{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:16px;
    padding:20px;
    box-shadow:var(--shadow);
  }
  .btn{
    font-family:var(--font-body);
    font-weight:700;
    font-size:14.5px;
    border-radius:11px;
    border:1px solid var(--line);
    background:var(--paper-raised);
    color:var(--ink);
    padding:12px 18px;
    cursor:pointer;
    transition:transform .12s ease, background .15s ease;
  }
  .btn:hover{background:var(--accent-soft)}
  .btn:active{transform:scale(.98)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn.primary{
    background:var(--accent);
    color:var(--accent-ink);
    border-color:var(--accent);
    width:100%;
    padding:14px 18px;
    font-size:15.5px;
  }
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.primary:disabled{opacity:.45;cursor:not-allowed;filter:none}
  .btn.ghost{background:transparent}

  .kanji-chip{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:28px;height:28px;
    border-radius:9px;
    font-family:var(--font-display);
    font-weight:700;
    font-size:15px;
    flex-shrink:0;
  }
  .cat-shoku{background:var(--cat-shoku-bg);color:var(--cat-shoku-fg)}
  .cat-i{background:var(--cat-i-bg);color:var(--cat-i-fg)}
  .cat-ju{background:var(--cat-ju-bg);color:var(--cat-ju-fg)}
  .cat-shohi{background:var(--cat-shohi-bg);color:var(--cat-shohi-fg)}
  .cat-iku{background:var(--cat-iku-bg);color:var(--cat-iku-fg)}
  .cat-fuku{background:var(--cat-fuku-bg);color:var(--cat-fuku-fg)}

  /* ---------- setup screen ---------- */
  .section-label{
    font-family:var(--font-display);
    font-weight:700;
    font-size:14.5px;
    color:var(--ink);
    margin:0 0 12px;
  }
  .cat-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
  }
  .cat-toggle{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 12px;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--paper);
    cursor:pointer;
    text-align:left;
    font-family:var(--font-body);
    color:var(--ink);
  }
  .cat-toggle .name{font-size:13px;font-weight:500;flex:1}
  .cat-toggle .count{font-size:11.5px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
  .cat-toggle[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}

  .count-row{display:flex;gap:8px;flex-wrap:wrap}
  .count-btn{
    flex:1;
    min-width:64px;
    padding:10px 8px;
    border-radius:11px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink-soft);
    font-weight:700;
    font-variant-numeric:tabular-nums;
    cursor:pointer;
  }
  .count-btn[aria-pressed="true"]{
    border-color:var(--accent);
    background:var(--accent);
    color:var(--accent-ink);
  }

  .stats-line{
    font-size:12.5px;
    color:var(--ink-soft);
    display:flex;
    gap:6px;
    align-items:baseline;
    font-variant-numeric:tabular-nums;
  }

  .note{
    font-size:12px;
    color:var(--ink-faint);
    line-height:1.75;
    border-top:1px dashed var(--line);
    padding-top:14px;
  }
  .note strong{color:var(--ink-soft)}

  /* ---------- quiz screen ---------- */
  .quiz-top{display:flex;flex-direction:column;gap:10px}
  .quiz-meta{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:13px;
    color:var(--ink-soft);
  }
  .quiz-meta .progress-num{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}

  .tape{
    display:flex;
    align-items:flex-end;
    gap:3px;
    height:22px;
  }
  .tape .tick{
    flex:1;
    background:var(--line);
    border-radius:1px;
    height:9px;
    transition:background .2s ease, height .2s ease;
  }
  .tape .tick.major{height:16px}
  .tape .tick.done{background:var(--accent)}
  .tape .tick.current{background:var(--gold);height:20px}

  .q-card{display:flex;flex-direction:column;gap:16px}
  .q-head{display:flex;align-items:center;gap:10px}
  .q-head .cat-name{font-size:12.5px;color:var(--ink-soft);font-weight:500}
  .q-text{
    font-size:17px;
    font-weight:500;
    line-height:1.75;
    text-wrap:balance;
  }
  .choices{display:flex;flex-direction:column;gap:9px}
  .choice{
    display:flex;
    align-items:flex-start;
    gap:12px;
    width:100%;
    text-align:left;
    padding:12px 14px;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:14.5px;
    line-height:1.6;
    cursor:pointer;
  }
  .choice:hover:not(:disabled){border-color:var(--accent)}
  .choice:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .choice .letter{
    flex-shrink:0;
    width:22px;height:22px;
    border-radius:50%;
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-size:11.5px;font-weight:700;color:var(--ink-soft);
  }
  .choice:disabled{cursor:default}
  .choice.correct{background:var(--good-bg);border-color:var(--good-ink);color:var(--good-ink)}
  .choice.correct .letter{border-color:var(--good-ink);color:var(--good-ink)}
  .choice.wrong{background:var(--bad-bg);border-color:var(--bad-ink);color:var(--bad-ink)}
  .choice.wrong .letter{border-color:var(--bad-ink);color:var(--bad-ink)}
  .choice.dim:disabled{opacity:.55}

  .explain{
    border-radius:12px;
    background:var(--accent-soft);
    padding:14px 16px;
    font-size:13.5px;
    line-height:1.75;
    color:var(--ink);
  }
  .explain .tag{
    display:inline-block;
    font-family:var(--font-display);
    font-weight:700;
    font-size:11.5px;
    letter-spacing:.05em;
    color:var(--accent);
    margin-bottom:6px;
  }
  .q-actions{display:flex;justify-content:flex-end}

  /* ---------- result screen ---------- */
  .score-hero{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 4px;text-align:center}
  .score-num{
    font-family:var(--font-display);
    font-weight:900;
    font-size:52px;
    font-variant-numeric:tabular-nums;
    letter-spacing:.01em;
  }
  .score-sub{color:var(--ink-soft);font-size:13.5px}

  .breakdown{display:flex;flex-direction:column;gap:10px}
  .bd-row{display:flex;align-items:center;gap:10px}
  .bd-row .name{font-size:12.5px;color:var(--ink-soft);width:112px;flex-shrink:0}
  .bd-track{flex:1;height:8px;border-radius:5px;background:var(--line);overflow:hidden}
  .bd-fill{height:100%;background:var(--accent);border-radius:5px}
  .bd-row .frac{font-size:12px;color:var(--ink-faint);width:38px;text-align:right;font-variant-numeric:tabular-nums}

  .review-item{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
  .review-item .q{font-weight:500;font-size:14px}
  .review-answers{font-size:13px;display:flex;flex-direction:column;gap:3px}
  .review-answers .mine{color:var(--bad-ink)}
  .review-answers .correct{color:var(--good-ink)}

  .result-actions{display:flex;gap:10px;flex-wrap:wrap}
  .result-actions .btn{flex:1;min-width:140px}

  [hidden]{display:none!important}

  @media (max-width:420px){
    .cat-grid{grid-template-columns:1fr 1fr}
    .score-num{font-size:44px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important}
  }
</style>

<div class="wrap">
  <header>
    <p class="eyebrow">家庭基礎 ・ 家庭総合対応</p>
    <h1>青陵家庭科ドリル</h1>
    <div class="stitch" aria-hidden="true"></div>
    <p class="tagline">仙台青陵高 1年生の家庭科定期試験対策用、一問一答ドリルです。</p>
  </header>

  <!-- ============ SETUP SCREEN ============ -->
  <main id="screen-setup">
    <section class="card">
      <p class="section-label">分野を選ぶ</p>
      <div class="cat-grid" id="cat-grid"></div>
    </section>

    <section class="card" style="margin-top:16px">
      <p class="section-label">問題数</p>
      <div class="count-row" id="count-row"></div>
    </section>

    <div style="margin-top:18px" class="card">
      <button class="btn primary" id="start-btn">はじめる</button>
      <p class="stats-line" id="stats-line" hidden></p>
      <p class="note">
        <strong>この問題について:</strong>
        本アプリの問題は、仙台青陵高等学校の実際の定期試験問題ではありません。文部科学省「高等学校学習指導要領(家庭)」が示す家庭基礎・家庭総合の学習内容と、消費者庁・厚生労働省・内閣府など公的機関の公表資料をもとに作成したオリジナルの練習問題です。試験範囲・出題傾向は授業プリントや教科書を必ず優先してください。
      </p>
    </div>
  </main>

  <!-- ============ QUIZ SCREEN ============ -->
  <main id="screen-quiz" hidden>
    <div class="quiz-top">
      <div class="quiz-meta">
        <span>問 <span class="progress-num" id="progress-num">1</span> / <span id="progress-total">10</span></span>
        <span id="quiz-score-live">正解 0</span>
      </div>
      <div class="tape" id="tape" aria-hidden="true"></div>
    </div>

    <div class="card q-card">
      <div class="q-head">
        <span class="kanji-chip" id="q-kanji">食</span>
        <span class="cat-name" id="q-catname">食生活</span>
      </div>
      <p class="q-text" id="q-text"></p>
      <div class="choices" id="q-choices"></div>
      <div class="explain" id="q-explain" hidden>
        <span class="tag">解説</span>
        <div id="q-explain-text"></div>
      </div>
      <div class="q-actions">
        <button class="btn primary" id="next-btn" style="width:auto" hidden>次へ</button>
      </div>
    </div>
  </main>

  <!-- ============ RESULT SCREEN ============ -->
  <main id="screen-result" hidden>
    <div class="card">
      <div class="score-hero">
        <div class="score-num" id="result-score">0 / 0</div>
        <div class="score-sub" id="result-pct">正答率 0%</div>
      </div>
    </div>

    <div class="card" style="margin-top:16px">
      <p class="section-label">分野別の結果</p>
      <div class="breakdown" id="breakdown"></div>
    </div>

    <div class="card" id="review-card" style="margin-top:16px">
      <p class="section-label">間違えた問題の復習</p>
      <div id="review-list" style="display:flex;flex-direction:column;gap:14px"></div>
    </div>

    <div class="result-actions" style="margin-top:16px">
      <button class="btn primary" id="retry-btn">同じ条件でもう一度</button>
      <button class="btn" id="home-btn">最初の画面に戻る</button>
    </div>
  </main>
</div>

<script>
(function(){
  "use strict";

  var CATS = {
    "食": {name:"食生活",        cls:"cat-shoku"},
    "衣": {name:"衣生活",        cls:"cat-i"},
    "住": {name:"住生活",        cls:"cat-ju"},
    "消": {name:"消費生活と環境", cls:"cat-shohi"},
    "育": {name:"家族と保育",    cls:"cat-iku"},
    "福": {name:"高齢者と福祉",  cls:"cat-fuku"}
  };

  var QUESTIONS = [
    {cat:"食", q:"五大栄養素のうち、微量で体の調子を整えたり抵抗力を高めたりする働きが中心のものはどれか。", choices:["たんぱく質","炭水化物","ビタミン","脂質"], a:2,
      exp:"ビタミンは体内でほとんど作られず、微量で体の機能を調整する働きを持つ。体をつくるのはたんぱく質・無機質、エネルギー源は炭水化物・脂質・たんぱく質である。"},
    {cat:"食", q:"3色食品群で、魚・肉・卵・大豆製品・乳製品など「体の組織をつくる」食品が分類される色は?", choices:["赤色群","黄色群","緑色群","白色群"], a:0,
      exp:"3色食品群では、赤=体をつくる、黄=エネルギーのもとになる、緑=体の調子を整える、に分類する。"},
    {cat:"食", q:"米・パン・いも類・油脂類など「エネルギーのもとになる」食品が分類される3色食品群の色は?", choices:["赤色群","黄色群","緑色群","白色群"], a:1,
      exp:"炭水化物や脂質を多く含む主食・いも・油脂類は黄色群に分類される。"},
    {cat:"食", q:"緑黄色野菜やきのこ、海藻など「体の調子を整える」食品が分類される3色食品群の色は?", choices:["赤色群","黄色群","緑色群","白色群"], a:2,
      exp:"ビタミン・無機質・食物繊維を多く含む野菜・きのこ・海藻・果物などは緑色群に分類される。"},
    {cat:"食", q:"厚生労働省が示す食中毒予防の3原則は「つけない」「増やさない」と、あと一つは何か。", choices:["冷やす","やっつける(菌を殺す)","捨てる","温める"], a:1,
      exp:"出典:厚生労働省。食中毒予防の3原則は「つけない・増やさない・やっつける」。加熱等により菌を死滅させることを指す。"},
    {cat:"食", q:"厚生労働省・農林水産省が、1日に「何を」「どれだけ」食べればよいかをコマの形のイラストで示した指針を何というか。", choices:["食事バランスガイド","食品表示基準","食育基本法","HACCP"], a:0,
      exp:"出典:厚生労働省・農林水産省「食事バランスガイド」。主食・副菜・主菜・牛乳乳製品・果物の望ましい量をコマの形で示している。"},
    {cat:"食", q:"和食の基本的な献立の型「一汁三菜」の「三菜」に含まれないものはどれか。", choices:["主菜","副菜","副々菜","主食"], a:3,
      exp:"一汁三菜は「汁物1+主菜1+副菜1+副々菜1」の構成を指す言葉で、ご飯(主食)は別に数える。"},
    {cat:"食", q:"消費者庁の食品表示基準における「賞味期限」と「消費期限」の説明として正しいものはどれか。", choices:["賞味期限はおいしく食べられる期限、消費期限は安全に食べられる期限","消費期限はおいしく食べられる期限、賞味期限は安全に食べられる期限","どちらも同じ意味である","消費期限は加工食品、賞味期限は生鮮食品に表示される"], a:0,
      exp:"出典:消費者庁食品表示基準。消費期限は劣化が早い食品に付く「安全に食べられる期限」、賞味期限は「品質が保たれ、おいしく食べられる期限の目安」。"},

  ];

  var CAT_ORDER = ["食","衣","住","消","育","福"];
  var STORAGE_KEY = "seiryo-kasei-drill-stats-v1";

  // ---------- state ----------
  var state = {
    screen: "setup",
    selectedCats: CAT_ORDER.slice(),
    countChoice: 10,
    quizIds: [],
    idx: 0,
    userAnswers: [],
    answeredCurrent: false
  };

  function catCount(cat){
    return QUESTIONS.reduce(function(n,q){ return n + (q.cat===cat?1:0); },0);
  }

  function loadStats(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }
  function saveStats(scorePct){
    try{
      var s = loadStats() || {attempts:0,best:0};
      s.attempts = (s.attempts||0)+1;
      s.best = Math.max(s.best||0, scorePct);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
    }catch(e){ /* private mode etc: ignore */ }
  }

  // ---------- element refs ----------
  var el = {};
  ["screen-setup","screen-quiz","screen-result",
   "cat-grid","count-row","start-btn","stats-line",
   "progress-num","progress-total","quiz-score-live","tape",
   "q-kanji","q-catname","q-text","q-choices","q-explain","q-explain-text","next-btn",
   "result-score","result-pct","breakdown","review-list","retry-btn","home-btn"
  ].forEach(function(id){ el[id.replace(/-([a-z])/g,function(_,c){return c.toUpperCase();})] = document.getElementById(id); });

  function showScreen(name){
    state.screen = name;
    el.screenSetup.hidden = name!=="setup";
    el.screenQuiz.hidden = name!=="quiz";
    el.screenResult.hidden = name!=="result";
    window.scrollTo(0,0);
  }

  // ---------- setup screen ----------
  function buildCatGrid(){
    el.catGrid.innerHTML = "";
    CAT_ORDER.forEach(function(cat){
      var meta = CATS[cat];
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "cat-toggle";
      btn.setAttribute("aria-pressed", state.selectedCats.indexOf(cat)>=0 ? "true":"false");
      btn.innerHTML =
        '<span class="kanji-chip '+meta.cls+'">'+cat+'</span>'+
        '<span class="name">'+meta.name+'</span>'+
        '<span class="count">'+catCount(cat)+'問</span>';
      btn.addEventListener("click", function(){
        var i = state.selectedCats.indexOf(cat);
        if(i>=0){
          if(state.selectedCats.length>1) state.selectedCats.splice(i,1);
        } else {
          state.selectedCats.push(cat);
        }
        buildCatGrid();
        buildCountRow();
      });
      el.catGrid.appendChild(btn);
    });
  }

  function availableCount(){
    return QUESTIONS.filter(function(q){ return state.selectedCats.indexOf(q.cat)>=0; }).length;
  }

  function buildCountRow(){
    var total = availableCount();
    var options = [5,10,20];
    if(state.countChoice!=="all" && state.countChoice>total) state.countChoice = total;
    el.countRow.innerHTML = "";
    options.forEach(function(n){
      if(n>total) return;
      var b = document.createElement("button");
      b.type="button"; b.className="count-btn";
      b.textContent = n+"問";
      b.setAttribute("aria-pressed", state.countChoice===n ? "true":"false");
      b.addEventListener("click", function(){ state.countChoice=n; buildCountRow(); });
      el.countRow.appendChild(b);
    });
    var allBtn = document.createElement("button");
    allBtn.type="button"; allBtn.className="count-btn";
    allBtn.textContent = "全"+total+"問";
    allBtn.setAttribute("aria-pressed", state.countChoice==="all" ? "true":"false");
    allBtn.addEventListener("click", function(){ state.countChoice="all"; buildCountRow(); });
    el.countRow.appendChild(allBtn);
  }

  function refreshStatsLine(){
    var s = loadStats();
    if(s && s.attempts){
      el.statsLine.hidden=false;
      el.statsLine.textContent = "これまでの挑戦回数 "+s.attempts+"回 ／ 自己ベスト正答率 "+s.best+"%";
    } else {
      el.statsLine.hidden=true;
    }
  }

  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }

  el.startBtn.addEventListener("click", function(){
    var pool = QUESTIONS
      .map(function(q,i){ return i; })
      .filter(function(i){ return state.selectedCats.indexOf(QUESTIONS[i].cat)>=0; });
    pool = shuffle(pool);
    var n = state.countChoice==="all" ? pool.length : Math.min(state.countChoice,pool.length);
    state.quizIds = pool.slice(0,n);
    state.idx = 0;
    state.userAnswers = new Array(state.quizIds.length).fill(null);
    el.progressTotal.textContent = state.quizIds.length;
    buildTape();
    showScreen("quiz");
    renderQuestion();
  });

  // ---------- quiz screen ----------
  function buildTape(){
    el.tape.innerHTML = "";
    state.quizIds.forEach(function(_,i){
      var t = document.createElement("div");
      t.className = "tick"+((i+1)%5===0 ? " major":"");
      el.tape.appendChild(t);
    });
  }
  function updateTape(){
    var kids = el.tape.children;
    for(var i=0;i<kids.length;i++){
      kids[i].classList.remove("done","current");
      if(i<state.idx) kids[i].classList.add("done");
      if(i===state.idx) kids[i].classList.add("current");
    }
  }

  function liveScore(){
    return state.userAnswers.filter(function(u,i){
      return u!=null && u===QUESTIONS[state.quizIds[i]].a;
    }).length;
  }

  function renderQuestion(){
    var qi = state.quizIds[state.idx];
    var q = QUESTIONS[qi];
    var meta = CATS[q.cat];
    state.answeredCurrent = false;

    el.progressNum.textContent = state.idx+1;
    el.quizScoreLive.textContent = "正解 "+liveScore();
    updateTape();

    el.qKanji.className = "kanji-chip "+meta.cls;
    el.qKanji.textContent = q.cat;
    el.qCatname.textContent = meta.name;
    el.qText.textContent = q.q;
    el.qExplain.hidden = true;
    el.nextBtn.hidden = true;

    el.qChoices.innerHTML = "";
    var letters=["A","B","C","D"];
    q.choices.forEach(function(choiceText, ci){
      var b = document.createElement("button");
      b.type="button";
      b.className="choice";
      b.innerHTML = '<span class="letter">'+letters[ci]+'</span><span>'+choiceText+'</span>';
      b.addEventListener("click", function(){ selectAnswer(ci); });
      el.qChoices.appendChild(b);
    });
  }

  function selectAnswer(ci){
    if(state.answeredCurrent) return;
    state.answeredCurrent = true;
    var qi = state.quizIds[state.idx];
    var q = QUESTIONS[qi];
    state.userAnswers[state.idx] = ci;

    var buttons = el.qChoices.querySelectorAll(".choice");
    buttons.forEach(function(b,i){
      b.disabled = true;
      if(i===q.a) b.classList.add("correct");
      else if(i===ci) b.classList.add("wrong");
      else b.classList.add("dim");
    });

    el.qExplainText.textContent = q.exp;
    el.qExplain.hidden = false;
    el.quizScoreLive.textContent = "正解 "+liveScore();
    el.nextBtn.hidden = false;
    el.nextBtn.textContent = (state.idx===state.quizIds.length-1) ? "結果を見る" : "次へ";
  }

  el.nextBtn.addEventListener("click", function(){
    if(state.idx < state.quizIds.length-1){
      state.idx++;
      renderQuestion();
    } else {
      showResult();
    }
  });

  // ---------- result screen ----------
  function showResult(){
    var total = state.quizIds.length;
    var correct = liveScore();
    var pct = total ? Math.round((correct/total)*100) : 0;
    el.resultScore.textContent = correct+" / "+total;
    el.resultPct.textContent = "正答率 "+pct+"%";
    saveStats(pct);

    var byCat = {};
    CAT_ORDER.forEach(function(c){ byCat[c]={correct:0,total:0}; });
    state.quizIds.forEach(function(qi,i){
      var q = QUESTIONS[qi];
      byCat[q.cat].total++;
      if(state.userAnswers[i]===q.a) byCat[q.cat].correct++;
    });
    el.breakdown.innerHTML = "";
    CAT_ORDER.forEach(function(c){
      var d = byCat[c];
      if(d.total===0) return;
      var pctc = Math.round((d.correct/d.total)*100);
      var row = document.createElement("div");
      row.className="bd-row";
      row.innerHTML =
        '<span class="name">'+CATS[c].name+'</span>'+
        '<span class="bd-track"><span class="bd-fill" style="width:'+pctc+'%"></span></span>'+
        '<span class="frac">'+d.correct+'/'+d.total+'</span>';
      el.breakdown.appendChild(row);
    });

    var wrongItems = state.quizIds
      .map(function(qi,i){ return {qi:qi, i:i}; })
      .filter(function(o){ return state.userAnswers[o.i]!==QUESTIONS[o.qi].a; });

    document.getElementById("review-card").hidden = wrongItems.length===0;
    el.reviewList.innerHTML = "";
    var letters=["A","B","C","D"];
    wrongItems.forEach(function(o){
      var q = QUESTIONS[o.qi];
      var mine = state.userAnswers[o.i];
      var div = document.createElement("div");
      div.className="review-item";
      div.innerHTML =
        '<div class="q">'+CATS[q.cat].name+' ／ '+q.q+'</div>'+
        '<div class="review-answers">'+
          '<span class="mine">あなたの解答: '+(mine==null? "(未回答)" : letters[mine]+" "+q.choices[mine])+'</span>'+
          '<span class="correct">正解: '+letters[q.a]+" "+q.choices[q.a]+'</span>'+
        '</div>'+
        '<div style="font-size:12.5px;color:var(--ink-soft)">'+q.exp+'</div>';
      el.reviewList.appendChild(div);
    });

    showScreen("result");
  }

  el.retryBtn.addEventListener("click", function(){
    state.idx = 0;
    state.quizIds = shuffle(state.quizIds);
    state.userAnswers = new Array(state.quizIds.length).fill(null);
    el.progressTotal.textContent = state.quizIds.length;
    buildTape();
    showScreen("quiz");
    renderQuestion();
  });
  el.homeBtn.addEventListener("click", function(){
    buildCatGrid();
    buildCountRow();
    refreshStatsLine();
    showScreen("setup");
  });

  // ---------- boot / hot reload ----------
  function start(savedState){
    if(savedState && savedState.screen){
      state = Object.assign(state, savedState);
    }
    buildCatGrid();
    buildCountRow();
    refreshStatsLine();

    if(state.screen==="quiz" && state.quizIds && state.quizIds.length){
      el.progressTotal.textContent = state.quizIds.length;
      buildTape();
      showScreen("quiz");
      renderQuestion();
      if(state.userAnswers[state.idx]!=null){
        var savedAns = state.userAnswers[state.idx];
        state.answeredCurrent = false;
        selectAnswer(savedAns);
      }
    } else if(state.screen==="result" && state.quizIds && state.quizIds.length){
      showResult();
    } else {
      showScreen("setup");
    }

    if(window.claude && window.claude.hot && window.claude.hot.snapshot){
      window.claude.hot.snapshot(function(){ return state; });
    }
  }

  if(window.claude && window.claude.hot && window.claude.hot.ready){
    window.claude.hot.ready(function(){ start(window.claude.hot.data || {}); });
  } else {
    start({});
  }
})();
</script>
